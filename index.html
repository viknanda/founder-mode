<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Get your Founder Mode on! Unicorn wisdom and hype tweets... Let's go!" />
  <title>Founder Mode</title>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div id="app">
    <header class="app-header">
      <div class="logo">FOUNDER<span class="highlight">.MODE</span></div>
      <a href="#" class="update-timer" id="timer">Let's Go 🚀: --:--</a>
    </header>

    <main class="feed-container" id="feed">
      <!-- Tweets will be injected here -->
    </main>

    <footer class="app-footer">
      <p>Made with ❤️ in the 🇺🇸 by Antigravity. May not be accurate. Get your Founder Mode on!</p>
    </footer>
  </div>

  <!-- Tweet Template -->
  <template id="tweet-template">
    <article class="tweet-card">
      <a class="tweet-header" href="#" target="_blank" rel="noopener noreferrer">
        <img class="avatar" src="" alt="Avatar">
        <div class="user-info">
          <span class="name"></span>
          <span class="handle"></span>
        </div>
      </a>
      <div class="tweet-body">
        <div class="tweet-content"></div>
        <span class="time"></span>
      </div>
      <div class="tweet-stats">
        <div class="stat"><span class="icon">&#x1F525;</span><span class="likes"></span></div>
      </div>
    </article>
  </template>

  <script type="module" src="./main.js"></script>
</body>

</html>
